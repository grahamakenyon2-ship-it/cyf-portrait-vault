<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" preserveAspectRatio="none">
  <!-- FATEBLADE universal button plate: carved oak, tooled leather, gold filigree — v0.6.7 -->
  <defs>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33270f"/>
      <stop offset=".5" stop-color="#241a0b"/>
      <stop offset="1" stop-color="#171006"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e0a0" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#f3e0a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldtrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d8a8"/>
      <stop offset=".5" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#8a6d2f"/>
    </linearGradient>
    <filter id="tool" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="4" result="n"/>
      <feDiffuseLighting in="n" lighting-color="#6a4a26" surfaceScale="1" diffuseConstant="1.1" result="t">
        <feDistantLight azimuth="230" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="t" in2="SourceGraphic" operator="in" result="tin"/>
      <feBlend in="tin" in2="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>

  <rect width="480" height="120" rx="8" fill="url(#oak)"/>
  <!-- tooled leather center panel -->
  <rect x="14" y="14" width="452" height="92" rx="5" fill="#1a120a"/>
  <rect x="14" y="14" width="452" height="92" rx="5" fill="#5a4022" filter="url(#tool)" opacity=".35"/>
  <!-- gold filigree frame -->
  <rect x="6" y="6" width="468" height="108" rx="7" fill="none" stroke="url(#goldtrim)" stroke-width="2.5"/>
  <rect x="13.5" y="13.5" width="453" height="93" rx="5.5" fill="none" stroke="#c9a24b" stroke-width="1" opacity=".45"/>
  <!-- corner flourishes -->
  <g stroke="url(#goldtrim)" stroke-width="1.6" fill="none" opacity=".7">
    <path d="M18,28 C18,18 28,18 34,18"/>
    <path d="M18,26 C18,22 22,18 26,18"/>
    <path d="M462,18 C468,18 462,18 462,18"/>
    <path d="M446,18 C456,18 462,24 462,30"/>
    <path d="M18,92 C18,100 26,102 34,102"/>
    <path d="M462,92 C462,100 454,102 446,102"/>
  </g>
  <circle cx="30" cy="30" r="2" fill="#e8d8a8" opacity=".6"/>
  <circle cx="450" cy="30" r="2" fill="#e8d8a8" opacity=".6"/>
  <circle cx="30" cy="90" r="2" fill="#e8d8a8" opacity=".6"/>
  <circle cx="450" cy="90" r="2" fill="#e8d8a8" opacity=".6"/>
  <!-- upper-left candle sheen -->
  <rect width="480" height="120" rx="8" fill="url(#sheen)"/>
</svg>
