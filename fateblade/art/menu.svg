<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- FATEBLADE vault hall — main menu backdrop, v0.6.7 -->
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120d07"/>
      <stop offset=".55" stop-color="#0a0806"/>
      <stop offset="1" stop-color="#0d0a06"/>
    </linearGradient>
    <radialGradient id="torch" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e8a850" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#a86a28" stop-opacity=".2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="center" cx=".5" cy=".5" r=".5">
      <stop offset=".35" stop-color="#000" stop-opacity=".75"/>
      <stop offset="1" stop-color="#000" stop-opacity=".15"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".9"/>
    </radialGradient>
    <linearGradient id="floorline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a16" stop-opacity=".0"/>
      <stop offset="1" stop-color="#3a2a16" stop-opacity=".35"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#hall)"/>

  <!-- vault floor, faint perspective lines -->
  <g stroke="#c9a24b" opacity=".06" stroke-width="1.5">
    <line x1="500" y1="1080" x2="880" y2="560"/>
    <line x1="760" y1="1080" x2="920" y2="560"/>
    <line x1="1160" y1="1080" x2="1000" y2="560"/>
    <line x1="1420" y1="1080" x2="1040" y2="560"/>
    <line x1="0" y1="980" x2="1920" y2="980"/>
    <line x1="0" y1="1030" x2="1920" y2="1030"/>
  </g>
  <rect x="0" y="560" width="1920" height="520" fill="url(#floorline)" opacity=".4"/>

  <!-- left shelf wall with tomes and scrolls -->
  <g opacity=".75">
    <rect x="0" y="0" width="330" height="1080" fill="#0d0a07"/>
    <g fill="#1a1410">
      <rect x="0" y="150" width="330" height="14"/><rect x="0" y="330" width="330" height="14"/>
      <rect x="0" y="510" width="330" height="14"/><rect x="0" y="690" width="330" height="14"/><rect x="0" y="870" width="330" height="14"/>
    </g>
    <!-- book spines -->
    <g>
      <rect x="18"  y="100" width="17" height="50" rx="2" fill="#3a2014"/><rect x="40"  y="92"  width="14" height="58" rx="2" fill="#2a2a16"/><rect x="60"  y="105" width="19" height="45" rx="2" fill="#402a10"/><rect x="84"  y="98"  width="13" height="52" rx="2" fill="#26181e"/><rect x="103" y="108" width="16" height="42" rx="2" fill="#3a2a1a"/><rect x="124" y="95"  width="15" height="55" rx="2" fill="#1e2a20"/><rect x="150" y="104" width="18" height="46" rx="2" fill="#33200f"/>
      <rect x="26"  y="282" width="15" height="48" rx="2" fill="#231a2a"/><rect x="47"  y="290" width="18" height="40" rx="2" fill="#3a2612"/><rect x="70"  y="285" width="13" height="45" rx="2" fill="#2a1e14"/><rect x="89"  y="292" width="17" height="38" rx="2" fill="#34140f"/><rect x="130" y="288" width="16" height="42" rx="2" fill="#20261c"/><rect x="180" y="295" width="14" height="35" rx="2" fill="#3a2a16"/>
      <rect x="20"  y="465" width="16" height="45" rx="2" fill="#2a1610"/><rect x="42"  y="470" width="14" height="40" rx="2" fill="#243020"/><rect x="78"  y="462" width="19" height="48" rx="2" fill="#3a2410"/><rect x="102" y="474" width="13" height="36" rx="2" fill="#2a1a24"/><rect x="150" y="466" width="17" height="44" rx="2" fill="#261e12"/>
      <rect x="30"  y="648" width="15" height="42" rx="2" fill="#33260e"/><rect x="66"  y="652" width="18" height="38" rx="2" fill="#1c2418"/><rect x="90"  y="645" width="14" height="45" rx="2" fill="#3a1c12"/><rect x="112" y="655" width="16" height="35" rx="2" fill="#2a2a1a"/><rect x="160" y="650" width="13" height="40" rx="2" fill="#301c10"/>
      <!-- rolled battle maps -->
      <rect x="200" y="470" width="90" height="10" rx="5" fill="#4a3a20"/><rect x="208" y="484" width="74" height="8" rx="4" fill="#3a2c16"/><rect x="196" y="655" width="96" height="10" rx="5" fill="#443318"/><rect x="204" y="669" width="80" height="8" rx="4" fill="#332410"/>
    </g>
  </g>

  <!-- right shelf wall, mirrored -->
  <g opacity=".75">
    <rect x="1590" y="0" width="330" height="1080" fill="#0d0a07"/>
    <g fill="#1a1410">
      <rect x="1590" y="150" width="330" height="14"/><rect x="1590" y="330" width="330" height="14"/>
      <rect x="1590" y="510" width="330" height="14"/><rect x="1590" y="690" width="330" height="14"/><rect x="1590" y="870" width="330" height="14"/>
    </g>
    <g>
      <rect x="1885" y="100" width="17" height="50" rx="2" fill="#3a2014"/><rect x="1862" y="92"  width="14" height="58" rx="2" fill="#2a2a16"/><rect x="1832" y="105" width="19" height="45" rx="2" fill="#402a10"/><rect x="1812" y="98"  width="13" height="52" rx="2" fill="#26181e"/><rect x="1789" y="108" width="16" height="42" rx="2" fill="#3a2a1a"/><rect x="1767" y="95"  width="15" height="55" rx="2" fill="#1e2a20"/><rect x="1738" y="104" width="18" height="46" rx="2" fill="#33200f"/>
      <rect x="1878" y="282" width="15" height="48" rx="2" fill="#231a2a"/><rect x="1854" y="290" width="18" height="40" rx="2" fill="#3a2612"/><rect x="1836" y="285" width="13" height="45" rx="2" fill="#2a1e14"/><rect x="1813" y="292" width="17" height="38" rx="2" fill="#34140f"/><rect x="1770" y="288" width="16" height="42" rx="2" fill="#20261c"/><rect x="1724" y="295" width="14" height="35" rx="2" fill="#3a2a16"/>
      <rect x="1882" y="465" width="16" height="45" rx="2" fill="#2a1610"/><rect x="1860" y="470" width="14" height="40" rx="2" fill="#243020"/><rect x="1820" y="462" width="19" height="48" rx="2" fill="#3a2410"/><rect x="1802" y="474" width="13" height="36" rx="2" fill="#2a1a24"/><rect x="1750" y="466" width="17" height="44" rx="2" fill="#261e12"/>
      <rect x="1872" y="648" width="15" height="42" rx="2" fill="#33260e"/><rect x="1834" y="652" width="18" height="38" rx="2" fill="#1c2418"/><rect x="1814" y="645" width="14" height="45" rx="2" fill="#3a1c12"/><rect x="1790" y="655" width="16" height="35" rx="2" fill="#2a2a1a"/><rect x="1744" y="650" width="13" height="40" rx="2" fill="#301c10"/>
      <rect x="1630" y="470" width="90" height="10" rx="5" fill="#4a3a20"/><rect x="1638" y="484" width="74" height="8" rx="4" fill="#3a2c16"/><rect x="1628" y="655" width="96" height="10" rx="5" fill="#443318"/><rect x="1636" y="669" width="80" height="8" rx="4" fill="#332410"/>
    </g>
  </g>

  <!-- hanging heraldic banners in the rafters -->
  <g>
    <path d="M560,0 L680,0 L672,150 L620,180 L568,148 Z" fill="#3a1414" opacity=".8"/>
    <path d="M560,0 L680,0 L678,10 L562,10 Z" fill="#c9a24b" opacity=".4"/>
    <circle cx="620" cy="80" r="16" fill="none" stroke="#c9a24b" stroke-width="2" opacity=".5"/>
    <path d="M1240,0 L1360,0 L1352,148 L1300,180 L1248,144 Z" fill="#3a1414" opacity=".8"/>
    <path d="M1240,0 L1360,0 L1358,10 L1242,10 Z" fill="#c9a24b" opacity=".4"/>
    <path d="M1292,50 L1316,50 L1312,116 L1300,130 L1288,114 Z" fill="none" stroke="#c9a24b" stroke-width="2" opacity=".5"/>
    <path d="M900,0 L1020,0 L1012,120 L960,148 L908,116 Z" fill="#2a1a12" opacity=".7"/>
    <path d="M900,0 L1020,0 L1018,9 L902,9 Z" fill="#c9a24b" opacity=".3"/>
  </g>

  <!-- iron sconces and torchlight -->
  <circle cx="140" cy="420" r="250" fill="url(#torch)"/>
  <circle cx="1780" cy="420" r="250" fill="url(#torch)"/>
  <circle cx="360" cy="900" r="180" fill="url(#torch)" opacity=".7"/>
  <circle cx="1560" cy="900" r="180" fill="url(#torch)" opacity=".7"/>
  <g fill="#241a10" stroke="#3a2a16" stroke-width="2">
    <path d="M132,392 L156,392 L150,440 L138,440 Z"/>
    <path d="M1772,392 L1796,392 L1790,440 L1778,440 Z"/>
  </g>
  <circle cx="144" cy="386" r="9" fill="#e8a850" opacity=".85"/>
  <circle cx="1784" cy="386" r="9" fill="#e8a850" opacity=".85"/>

  <!-- dust motes in torchlight -->
  <g fill="#e8d8a8">
    <circle cx="240" cy="330" r="2" opacity=".12"/><circle cx="310" cy="480" r="1.5" opacity=".1"/><circle cx="180" cy="560" r="2.5" opacity=".09"/><circle cx="420" cy="380" r="1.5" opacity=".11"/><circle cx="520" cy="520" r="2" opacity=".08"/><circle cx="1680" cy="350" r="2" opacity=".12"/><circle cx="1750" cy="500" r="1.5" opacity=".1"/><circle cx="1620" cy="560" r="2.5" opacity=".09"/><circle cx="1500" cy="400" r="1.5" opacity=".11"/><circle cx="1400" cy="540" r="2" opacity=".08"/>
    <circle cx="250" cy="800" r="2" opacity=".08"/><circle cx="500" cy="880" r="1.5" opacity=".07"/><circle cx="1670" cy="820" r="2" opacity=".08"/><circle cx="1440" cy="900" r="1.5" opacity=".07"/>
  </g>

  <!-- dark empty center for the golden title + buttons -->
  <ellipse cx="960" cy="540" rx="700" ry="480" fill="url(#center)"/>
  <!-- vignette -->
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
