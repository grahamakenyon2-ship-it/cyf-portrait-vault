name: paint-vault
on:
  workflow_dispatch:      # manual only - run from the Actions tab when a batch should be painted
    inputs:
      batch:
        description: 'Sittings per run (default 40)'
        required: false
        default: '40'
permissions:
  contents: write
concurrency:
  group: paint-vault
  cancel-in-progress: false   # never kill a sitting mid-stroke; the next run waits its turn
jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paint the missing faces
        run: |
          if node paint.mjs; then
            git config user.name "portrait-keeper"
            git config user.email "keeper@users.noreply.github.com"
            git add -A
            git diff --cached --quiet && echo "nothing new" && exit 0
            git commit -m "gallery: new portraits"
            git push
          else
            echo "painter finished with nothing new (or paused) - no commit"
          fi
        env:
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          BATCH: ${{ github.event.inputs.batch || '40' }}
          CONC: 4
