name: paint-vault
on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes until the roster is complete
  workflow_dispatch:           # also runnable by hand from the Actions tab
    inputs:
      batch:
        description: 'Sittings per run (default 40)'
        required: false
        default: '40'
permissions:
  contents: write
  actions: write              # lets the workflow disable itself when the vault is full
concurrency:
  group: paint-vault
  cancel-in-progress: false    # never kill a sitting mid-stroke; the next run waits its turn
jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paint the missing faces
        run: |
          node paint.mjs
          rc=$?
          if [ "$rc" -eq 0 ]; then
            git config user.name "portrait-keeper"
            git config user.email "keeper@users.noreply.github.com"
            git add -A
            git diff --cached --quiet && echo "nothing new" && exit 0
            git commit -m "gallery: new portraits"
            git push
          elif [ "$rc" -eq 2 ]; then
            echo "VAULT COMPLETE - every face on the roster is painted. Disabling this workflow so the cron stops for good."
            echo "To paint a future batch: re-enable paint-vault in the Actions tab, run it once by hand, and it will disable itself again when done."
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/paint-vault.yml/disable"
          else
            echo "painter stopped early (key refused, rate limits, or errors) - the next scheduled run retries; check the log"
            exit 1
          fi
        env:
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          BATCH: ${{ github.event.inputs.batch || '40' }}
          CONC: 4
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
