name: Fateblade Sync Cards (from CYF-Cards)

# SYNC-V3 (Oct 23 2026): "ship by bumping the queue" — PAT-free.
# The agent pushes the source files to the vault in vault format
# (fateblade/src/*, fateblade/data/cards.json as JSON.stringify(D,null,1)+'\n')
# plus the sync-queue bump; THIS workflow then recomputes everything:
# wrappers (cards.js), manifest (all sha256s from the tree, version from the
# QUEUE — v2 Oct 26: engine/game.html-only ships can bump without a cards.json
# change; queue must be >= cards semver), guard, commit. No per-version patch
# scripts, no hand-built manifests. The guard runs BEFORE the commit: drift
# never lands on main. Also runnable by hand from the Actions tab. Idempotent:
# no-op on clean.
# PHASE-2 NOTE (Oct 26): the agent NEVER stages manifest.json anymore — this
# workflow owns it end to end (push-kit v2 pipeline).

on:
  push:
    branches: [main]
    paths: ['fateblade/sync-queue.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fateblade-sync-cards

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            fateblade
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Sanity (queue version >= cards version, fresh sync)
        run: |
          set -e
          QV=$(node -e "const q=require('./fateblade/sync-queue.json');console.log(q.version||q.pending[0].version||'')")
          CV=$(node -e "const c=require('./fateblade/data/cards.json');console.log(c.version||'')")
          echo "queue=$QV cards=$CV"
          if ! node -e "
            const q='$QV', c='$CV', pv=v=>String(v).split('.').map(Number);
            const [a,b]=[pv(q),pv(c)];
            for (let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]||0,y=b[i]||0;if(x>y)process.exit(0);if(x<y)process.exit(1);}
            process.exit(0);
          "; then
            echo "SYNC RIG MISMATCH: sync-queue.json version ($QV) is BEHIND data/cards.json ($CV) — bump the queue to at least the cards version"; exit 1;
          fi
      - name: Regen wrappers + manifest (recompute from the tree)
        run: |
          set -e
          node fateblade/regen-wrappers.mjs --apply
          node fateblade/regen-manifest.mjs --apply
      - name: Guard (drift never ships — runs BEFORE the commit)
        run: |
          set -e
          node fateblade/vault-consistency-guard.mjs
      - name: Commit if anything drifted (with race replay)
        run: |
          set -e
          git add -A fateblade
          if git diff --cached --quiet; then
            echo "NO DRIFT - vault fully in sync"
            exit 0
          fi
          # Replayable-artifact pattern: never pull --rebase.
          git diff --cached --name-only > /tmp/staged-files.txt
          mkdir -p /tmp/staged
          while read -r p; do
            mkdir -p "/tmp/staged/$(dirname "$p")"
            cp "$p" "/tmp/staged/$p"
          done < /tmp/staged-files.txt
          git fetch origin main
          git reset --hard origin/main
          while read -r p; do
            cp "/tmp/staged/$p" "$p"
          done < /tmp/staged-files.txt
          SYNCV=$(node -e "const c=require('./fateblade/data/cards.json');console.log(c.version)")
          git config user.name "fateblade-bot"
          git config user.email "fateblade-bot@users.noreply.github.com"
          git add -A fateblade
          git commit -m "vault sync: version $SYNCV — recompute wrappers+manifest+guard (SYNC-V3, queue-triggered)"
          if ! git push origin main; then
            echo "push raced; replaying on fresh main"
            sleep 15
            git fetch origin main
            git reset --hard origin/main
            while read -r p; do
              cp "/tmp/staged/$p" "$p"
            done < /tmp/staged-files.txt
            git add -A fateblade
            git commit -m "vault sync: version $SYNCV — recompute wrappers+manifest+guard (SYNC-V3, queue-triggered)"
            git push origin main
          fi
      - name: Guard again post-commit
        run: |
          set -e
          node fateblade/vault-consistency-guard.mjs
