name: Fateblade Sync Cards (from CYF-Cards)

# Self-firing vault sync: patch cards.json + regen wrappers + manifest +
# guard, all in ONE commit.
#
# LESSON (learned v0.30 ship #1): commits made with GITHUB_TOKEN do NOT
# trigger other workflows, so a sync commit relying on the separate
# Fateblade Build Cards workflow never fires it. This workflow therefore
# runs regen-wrappers.mjs itself and commits cards.json + cards.js +
# manifest.json together, then runs the consistency guard.
#
# TRIGGER: agent pushes fateblade/sync-queue.json after a realm PR
# merge; also runnable by hand from the Actions tab.
# Idempotent: no-op when everything already matches. The patch script
# hard-gates the output sha256 (exit 1, no commit) on any mismatch.

on:
  push:
    branches: [main]
    paths: ['fateblade/sync-queue.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fateblade-sync-cards

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            fateblade
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply pending sha-gated patch (skip if already synced)
        run: |
          set -e
          CARD=fateblade/data/cards.json
          ACTUAL=$(sha256sum "$CARD" | cut -d' ' -f1)
          echo "vault cards.json sha256: $ACTUAL"
          if [ "$ACTUAL" = "$EXPECTED_OUT" ]; then
            echo "cards.json already synced - skipping patch"
          else
            cp "$CARD" /tmp/cards.json
            FB_CARDS_PATH=/tmp/cards.json node fateblade/sync/cards-patch-v032-pairmint.mjs
            cp /tmp/cards.json "$CARD"
            echo "patch applied + sha-gated"
          fi
        env:
          EXPECTED_OUT: '05650f00982e5e120f3e82effa0c23e9cdc3adfc158a61bba7cd76406f404cd7'
      - name: Regen wrappers + manifest (always)
        run: |
          set -e
          node fateblade/regen-wrappers.mjs --apply
      - name: Commit if anything drifted (with race replay)
        run: |
          set -e
          git add -A fateblade
          if git diff --cached --quiet; then
            echo "NO DRIFT - vault fully in sync"
            exit 0
          fi
          # Replayable-artifact pattern: never pull --rebase.
          git diff --cached --name-only > /tmp/staged-files.txt
          mkdir -p /tmp/staged
          while read -r p; do
            mkdir -p "/tmp/staged/$(dirname "$p")"
            cp "$p" "/tmp/staged/$p"
          done < /tmp/staged-files.txt
          git fetch origin main
          git reset --hard origin/main
          while read -r p; do
            cp "/tmp/staged/$p" "$p"
          done < /tmp/staged-files.txt
          git config user.name "fateblade-bot"
          git config user.email "fateblade-bot@users.noreply.github.com"
          git add -A fateblade
          git commit -m "vault sync: cards.json v0.32.0 pairing mint + wrappers + manifest (sha-gated patch, queue-triggered)"
          if ! git push origin main; then
            echo "push raced; replaying on fresh main"
            sleep 15
            git fetch origin main
            git reset --hard origin main
            while read -r p; do
              cp "/tmp/staged/$p" "$p"
            done < /tmp/staged-files.txt
            git add -A fateblade
            git commit -m "vault sync: cards.json v0.32.0 pairing mint + wrappers + manifest (sha-gated patch, queue-triggered)"
            git push origin main
          fi
      - name: Guard (drift never ships)
        run: |
          set -e
          node fateblade/vault-consistency-guard.mjs
