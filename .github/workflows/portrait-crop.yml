name: Portrait Crop
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = analyze only (safe) | crop = trim detected images + commit'
        required: true
        default: 'report'
      limit:
        description: 'Max images to process (0 = all)'
        required: false
        default: '0'

jobs:
  crop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install imaging deps
        run: pip install pillow numpy
      - name: Run crop pass
        run: python tools/crop-portraits.py "${{ github.event.inputs.mode }}" "${{ github.event.inputs.limit }}"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crop-report
          path: crop-report.csv
          if-no-files-found: ignore
      - name: Commit cropped images + manifest
        if: github.event.inputs.mode == 'crop'
        run: |
          git config user.name "portrait-crop bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing needed cropping — no commit"
          else
            git commit -m "portrait-crop: auto-trim dead margins (content-box detection, tight art untouched)"
            git push
          fi
