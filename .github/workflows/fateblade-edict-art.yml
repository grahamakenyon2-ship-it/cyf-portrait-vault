name: fateblade-edict-art\non:\n  workflow_dispatch:             # run by hand from the Actions tab; re-run until it reports the vault complete\n    inputs:\n      batch:\n        description: 'Images per run (default 20 - slow and steady; raise only if Commons stops throttling)'\n        required: false\n        default: '20'\npermissions:\n  contents: write\n  actions: write                 # lets the workflow disable itself when the vault is complete\nconcurrency:\n  group: vault-painter           # SHARED with flag-vault/paint-themes: one painter in the repo at a time\n  cancel-in-progress: false\njobs:\n  fetch:\n    runs-on: ubuntu-latest\n    timeout-minutes: 50\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n      - name: Fetch the missing edict/relic art (chunked)\n        id: fetch\n        run: |\n          set +e\n          node fetch-edict-art.mjs\n          rc=$?\n          echo \"rc=$rc\" >> \"$GITHUB_OUTPUT\"\n          echo \"fetch-edict-art exit code: $rc\"\n          exit 0\n        env:\n          BATCH: ${{ github.event.inputs.batch || '20' }}\n      - name: Commit the chunk\n        run: |\n          git config user.name \"edict-art-keeper\"\n          git config user.email \"keeper@users.noreply.github.com\"\n          git add fateblade/art fateblade/manifest.json\n          git diff --cached --quiet && echo \"nothing new\" && exit 0\n          git commit -m \"fateblade: edict/relic art vault chunk\"\n          for i in 1 2 3; do\n            if git push; then exit 0; fi\n            echo \"push rejected - rebasing on remote and retrying (attempt $i)\"\n            git pull --rebase origin \"$GITHUB_REF_NAME\" || exit 1\n          done\n          echo \"push failed after 3 attempts\" && exit 1\n      - name: Complete - disable this workflow\n        if: steps.fetch.outputs.rc == '2'\n        run: |\n          echo \"EDICT/RELIC ART VAULT COMPLETE - every edict and relic has its artwork mirrored. Disabling this workflow.\"\n          echo \"(If new edicts/relics are added later, append to fateblade/art/edict-sources.txt, re-enable and re-run from the Actions tab.)\"\n          curl -s -X POST -H \"Authorization: Bearer $GH_TOKEN\" -H \"Accept: application/vnd.github+json\" \\\n            \"https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/fateblade-edict-art.yml/disable\"\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n# v1.1 (Oct 20 2026): re-enabled for EXPANSION BATCH 1 - 59 new edict/relic\n# targets + 21 stockpile assets appended to edict-sources.txt. Self-disables\n# again when the expanded vault is complete.\n