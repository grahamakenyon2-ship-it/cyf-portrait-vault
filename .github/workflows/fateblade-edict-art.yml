name: fateblade-edict-art
on:
  workflow_dispatch:             # run by hand from the Actions tab; re-run until it reports the vault complete
    inputs:
      batch:
        description: 'Images per run (default 20 - slow and steady; raise only if Commons stops throttling)'
        required: false
        default: '20'
permissions:
  contents: write
  actions: write                 # lets the workflow disable itself when the vault is complete
concurrency:
  group: vault-painter           # SHARED with flag-vault/paint-themes: one painter in the repo at a time
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the missing edict/relic art (chunked)
        id: fetch
        run: |
          set +e
          node fetch-edict-art.mjs
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "fetch-edict-art exit code: $rc"
          exit 0
        env:
          BATCH: ${{ github.event.inputs.batch || '20' }}
      - name: Commit the chunk
        run: |
          git config user.name "edict-art-keeper"
          git config user.email "keeper@users.noreply.github.com"
          git add fateblade/art fateblade/manifest.json
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "fateblade: edict/relic art vault chunk"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected - rebasing on remote and retrying (attempt $i)"
            git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
          done
          echo "push failed after 3 attempts" && exit 1
      - name: Complete - disable this workflow
        if: steps.fetch.outputs.rc == '2'
        run: |
          echo "EDICT/RELIC ART VAULT COMPLETE - every edict and relic has its artwork mirrored. Disabling this workflow."
          echo "(If new edicts/relics are added later, append to fateblade/art/edict-sources.txt, re-enable and re-run from the Actions tab.)"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/fateblade-edict-art.yml/disable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# v1.1 (Oct 20 2026): re-enabled for EXPANSION BATCH 1 - 59 new edict/relic art
# targets + 21 stockpile assets appended to edict-sources.txt. Self-disables
# again when the expanded vault is complete.
