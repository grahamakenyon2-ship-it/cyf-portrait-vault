name: paint-themes
on:
  workflow_dispatch: {}           # run by hand from the Actions tab; no cron - a few long sittings
permissions:
  contents: write
  actions: write                 # lets the workflow disable itself when the vault is full
concurrency:
  group: vault-painter            # SHARED with paint-vault: one painter in the repo at a time
  cancel-in-progress: false
jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paint the missing textures
        run: |
          node paint-themes.mjs
          rc=$?
          if [ "$rc" -eq 0 ]; then
            git config user.name "theme-keeper"
            git config user.email "keeper@users.noreply.github.com"
            git add -A
            git diff --cached --quiet && echo "nothing new" && exit 0
            git commit -m "themes: new dress textures"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "push rejected - rebasing on remote and retrying (attempt $i)"
              git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
            done
            echo "push failed after 3 attempts" && exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "THEME VAULT COMPLETE - every dress has its texture. Disabling this workflow."
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/paint-themes.yml/disable"
          else
            echo "theme painter stopped early (moderation, rate limits, or errors) - run it again from the Actions tab"
            git config user.name "theme-keeper"
            git config user.email "keeper@users.noreply.github.com"
            git add themes/failures.txt
            git diff --cached --quiet || {
              git commit -m "themes: failure diagnostics"
              for i in 1 2 3; do
                if git push; then break; fi
                git pull --rebase origin "$GITHUB_REF_NAME" || break
              done
            }
            exit 1
          fi
        env:
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
